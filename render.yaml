# RemodelaUSA — Despliegue a producción
# Blueprint para Render.com (servicio Node con disco persistente para SQLite)

services:
  - type: web
    name: remodelausa
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && DATA_DIR=/tmp/remodelausa-build npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24" # node:sqlite requiere Node 22.5+; usa 22 si 24 no está disponible
      - key: DATA_DIR
        value: /var/data/remodelausa
      - key: PUBLIC_URL
        sync: false # pon aquí tu URL real, ej. https://remodelausa.com
      - key: ADMIN_TOKEN
        generateValue: true # token aleatorio SOLO en la primera creación; si ya existe un valor, RÓTALO a mano en el dashboard (la clave vieja 'remodelausa-admin' ya no funciona: fail closed)
      - key: RESEND_API_KEY
        sync: false # opcional: correos reales
      - key: FROM_EMAIL
        sync: false # remitente verificado en Resend (CAN-SPAM), p. ej. hello@remodelausa.com
      - key: OWNER_POSTAL_ADDRESS
        sync: false # dirección postal física del dueño (CAN-SPAM: pie de cada correo)
      - key: STRIPE_SECRET_KEY
        sync: false # opcional: cobro real de comisiones
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # opcional: verifica la firma del webhook de Stripe (/api/billing/webhook)
    disk:
      name: remodelausa-data
      mountPath: /var/data/remodelausa
      sizeGB: 1
